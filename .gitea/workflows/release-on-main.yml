name: Release merged changes

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: gitea.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          # Gitea's pull_request ref is the PR head, not the merge commit.
          ref: ${{ gitea.event.pull_request.merge_commit_sha }}
          fetch-depth: 1
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Create release notes and release
        env:
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          MERGE_COMMIT_SHA: ${{ gitea.event.pull_request.merge_commit_sha }}
          PULL_REQUEST_NUMBER: ${{ gitea.event.pull_request.number }}
        run: python3 scripts/create-merged-release.py
